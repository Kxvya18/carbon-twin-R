seed: 42
n_steps: 3000
freq_minutes: 15

fault:
  type: gradual_cooling
  start_fraction: 0.70
  severity: 0.18
  ramp_steps: 500

split:
  train_fraction: 0.60
  calibration_fraction: 0.15

model:
  random_state: 42
  max_iter: 300

uncertainty:
  alpha: 0.05

kalman:
  q: 0.02
  r: 0.60
  critical_degradation: 2.0

cusum:
  drift: 0.15
  threshold: 6.0

sprt:
  healthy_mean: 0.0
  degraded_mean: 2.0
  sigma: 1.5
  alpha: 0.05
  beta: 0.10

carbon:
  base_kg_per_kwh: 0.55
