[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "carbontwin-r"
version = "0.2.0"
description = "Research-grade counterfactual ML, statistical inference, graph analysis and causal simulation for avoidable carbon emissions"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "matplotlib>=3.8",
  "PyYAML>=6.0",
  "joblib>=1.3",
  "requests>=2.31",
  "pyarrow>=15.0",
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "pydantic>=2.6",
  "streamlit>=1.31",
  "pytest>=8.0"
]

[project.optional-dependencies]
advanced = [
  "xgboost>=2.0",
  "torch>=2.2",
  "torch-geometric>=2.5",
  "econml>=0.15",
  "shap>=0.45"
]

[project.scripts]
carbontwin = "carbontwin_r.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
